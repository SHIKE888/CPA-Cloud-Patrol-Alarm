# 安装到 /etc/sysctl.d/90-ros-relay.conf，再执行 sysctl -p
#
# 为什么需要：热点/弱网下 3840x1080@28 的 MJPEG 约 4.6 MB/s，正好吃满
# AIC8800 USB 网卡的上行（实测 37 Mbps）。内核默认允许单条 TCP 囤 4 MB
# 发送缓冲（≈20 帧），控制请求只能排在旧帧后面。
#
# 2026-11-18 实测（手机热点 Pura70，-61 dBm，推流中 ping 网关 30 次）：
#   tcp_wmem 上限 4194304 ->  avg 290 ms / max 1034 ms
#   tcp_wmem 上限 1048576 ->  avg 229 ms / max  742 ms
#   tcp_wmem 上限  131072 ->  avg  60 ms / max  371 ms   ← 现在这个
# 再往下（64 KB）会限制吞吐：14 Mbps 链路的 BDP 约 87 KB，128 KB 刚好够。
#
# 另外实测到慢客户端的 nginx 连接 Send-Q 能堆到 940 KB（= 几千毫秒延迟），
# 抬高上限就是为了把这段积压硬压住。

net.ipv4.ip_forward=1
net.ipv4.tcp_wmem = 4096 16384 131072
