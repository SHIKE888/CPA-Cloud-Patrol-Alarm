# 安装到 /etc/NetworkManager/conf.d/99-wifi-powersave-off.conf
#
# 和 deploy/99-wifi-powersave-off（NetworkManager dispatcher 脚本）作用相同，
# 但这里是**全局配置**：不依赖每个连接 profile，也不依赖 up 事件是否触发，
# 换 WiFi / 手机热点都自动生效。
#
# AIC8800 USB 网卡的省电会让控制器攒够信标周期才收发，实测到网关的 ping
# avg 1052 ms / max 2967 ms；关掉后 avg 92 ms。2026-11-18 再叠加
# sysctl 的发送缓冲收紧（见 90-ros-relay.conf），推流中 avg 降到 60 ms。

[connection]
wifi.powersave = 2
