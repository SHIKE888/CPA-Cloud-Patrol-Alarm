#!/usr/sbin/nft -f
# RK3576 中继：车端(192.168.100.0/24 @ end1) -> 外部 WiFi(wlx*) 的 NAT
# 部署：cp /etc/nftables.conf.bak && cp 本文件 /etc/nftables.conf && systemctl enable --now nftables
flush ruleset

define WAN_IF  = "wlx8c7ab3f8171b"
define LAN_IF  = "end1"
define LAN_NET = 192.168.100.0/24

table inet filter {
    chain input {
        type filter hook input priority filter; policy accept;
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname $LAN_IF accept
        oifname $LAN_IF accept
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN_IF ip saddr $LAN_NET masquerade
    }
}
