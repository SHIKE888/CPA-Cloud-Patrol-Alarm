# RK3576 中继 chrony：既对外同步，也作为车端(192.168.100.0/24)的 NTP 源
# 车端无外网时，TF 时间戳依赖这里的对时（偏差 >10ms 会报 extrapolation）
# 部署：cp /etc/chrony/chrony.conf /etc/chrony/chrony.conf.bak
#       cp 本文件 /etc/chrony/chrony.conf && systemctl restart chrony

pool 192.168.1.1 iburst
pool ntp.aliyun.com iburst
pool cn.pool.ntp.org iburst

driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
maxupdateskew 100.0
rtcsync

# 允许中继链路(v4)上的车端来对时
allow 192.168.100.0/24

# 车端暂时没有 GPS/外网时也能拿到时间
local stratum 8
