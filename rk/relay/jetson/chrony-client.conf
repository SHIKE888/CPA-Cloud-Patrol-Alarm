# 车端 chrony 客户端：优先同步中继(192.168.100.2)，网卡未接时退回公网 NTP
# TF 要求两端时差 < 10ms，否则 rviz/Foxglove 报 extrapolation / future timestamp
# 部署：cp /etc/chrony/chrony.conf /etc/chrony/chrony.conf.bak_rosrelay
#       cp 本文件 /etc/chrony/chrony.conf && systemctl restart chrony

server 192.168.100.2 iburst minpoll 4 maxpoll 6 prefer
pool ntp.aliyun.com iburst
pool cn.pool.ntp.org iburst

driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3
rtcsync
