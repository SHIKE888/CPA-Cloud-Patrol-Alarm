# RK3576 中继：给车端 USB 网卡(RTL8153)自动分配 192.168.100.x
# 目的：车端插上网卡后零配置（Ubuntu NetworkManager 对有线口默认 DHCP）
# 部署： cp 本文件 /etc/dnsmasq.d/ros-relay.conf && systemctl enable --now dnsmasq
#
# 注意：故意不下发 option 3(router)，让车端不会新增默认路由，
#       避免顶掉车端自身的 wlan0/eth0 路由。

interface=end1
bind-dynamic

# 只对中继链路提供服务
dhcp-range=192.168.100.50,192.168.100.150,255.255.255.0,12h
dhcp-option=1,255.255.255.0
dhcp-option=6,192.168.100.2
dhcp-option=42,192.168.100.2
dhcp-authoritative

# 车端 RTL8153(eth1) 固定租约。
# 中继上配了 root -> wheeltec@<此IP> 的免密 SSH，IP 一变就失效，
# 所以不能让它从地址池里随机拿。MAC 取自车端 eth1（00:e0:4c:68:00:10）。
dhcp-host=00:e0:4c:68:00:10,192.168.100.87,wheeltec,24h

# 顺带提供 DNS 转发（上游用中继自己的 /etc/resolv.conf），
# 这样车端即便不能上网，也能解析域名；若不需要可加 port=0 关掉。
log-queries=no
cache-size=500
