# /etc/nginx/sites-available/ros-relay   （软链到 sites-enabled/）
# RK3576 中继：静态网页 + WebSocket 反代到车端(192.168.100.87)
# 车端 foxglove_bridge :8765 / rosbridge_server :9090
#
# 【坑】proxy_set_header Host 必须带端口！
#   rosbridge 是 Tornado 应用，跑在非标准端口 9090 上，会校验 Host 头里必须含
#   端口（防 DNS rebinding）。照抽常见写法 `Host $host;`，$host 只有主机名，
#   rosbridge 直接回：
#     400 missing port in HTTP Host header 'x' and server runs on non-standard port 9090
#   所以写死成 "车端IP:车端端口"。改车端地址时 upstream 和这两行要一起改。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ros_ws {
    server 192.168.100.87:8765;
    keepalive 8;
}

upstream ros_bridge {
    server 192.168.100.87:9090;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ros-relay;
    index index.html;

    access_log /var/log/nginx/ros-relay.access.log;
    error_log  /var/log/nginx/ros-relay.error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Foxglove WebSocket（浏览器填 ws://<中继>/foxglove）
    location /foxglove {
        proxy_pass http://ros_ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 192.168.100.87:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # rosbridge（浏览器填 ws://<中继>/rosbridge，网页控制台用这个）
    location /rosbridge {
        proxy_pass http://ros_bridge/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 192.168.100.87:9090;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 中继自检（不依赖车端）
    location = /relay-health {
        default_type application/json;
        return 200 '{"role":"rk3576-relay","lan":"192.168.100.2","car":"192.168.100.87","ws":"\/rosbridge","foxglove":"\/foxglove"}';
    }

    # 2026-10-30 车端校时用：返回本板 unix 时间（秒.毫秒）。
    # 车端没有外网、也没有可用的 NTP 同步，只能从这条中继链路取时间；
    # 车端脚本 /usr/local/bin/rk-time-sync 会 curl 这个地址（见 rk/relay/jetson/install_rk_time.sh）。
    location = /time {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "$msec";
    }
}
