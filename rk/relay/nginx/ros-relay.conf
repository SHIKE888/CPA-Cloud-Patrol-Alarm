# /etc/nginx/sites-available/ros-relay   （软链到 sites-enabled/）
# RK3576 中继：静态网页 + WebSocket 反代到车端(192.168.100.87)
# 车端 foxglove_bridge :8765 / rosbridge_server :9090
#
# 【坑】proxy_set_header Host 必须带端口！
#   rosbridge 是 Tornado 应用，跑在非标准端口 9090 上，会校验 Host 头里 必须含
#   端口（防 DNS rebinding）。照抽常见写法 `Host $host;`，$host 只有主机名，
#   rosbridge 直接回：
#     400 missing port in HTTP Host header 'x' and server runs on non-standard port 9090
#   所以写死成 "车端IP:车端端口"。改车端地址时 upstream 和这两行要一起改。
#
# 【坑】多设备同时看视频流（2026-11-01）
#   反代之后后端 mipi_webstream 看到的 peer 永远是 127.0.0.1，
#   而它按「单 IP 只保留最新一路流」限流 -> 所有设备被当成同一台，互相顶掉。
#   修法：这里把真实客户端 IP 通过 X-Real-IP / X-Forwarded-For 传下去，
#   后端在 peer 是回环地址时优先采用这两个头。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ros_ws {
    server 192.168.100.87:8765;
    keepalive 8;
}

upstream ros_bridge {
    server 192.168.100.87:9090;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ros-relay;
    index index.html;

    access_log /var/log/nginx/ros-relay.access.log;
    error_log  /var/log/nginx/ros-relay.error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Foxglove WebSocket（浏览器填 ws://<中继>/foxglove）
    location /foxglove {
        proxy_pass http://ros_ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 192.168.100.87:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # rosbridge（浏览器填 ws://<中继>/rosbridge，网页控制台用这个）
    location /rosbridge {
        proxy_pass http://ros_bridge/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 192.168.100.87:9090;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 中继自检（不依赖车端）
    # ---- 视频推流：本机 mipi_webstream.py(9012)，对外统一走 80 端口，不再需要 :9012 ----
    location /stream {
        proxy_pass http://127.0.0.1:9012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ★ 真实客户端 IP：后端据此做「单设备一路流」限流，缺了它所有设备都算一个
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    location = /snapshot.jpg {
        proxy_pass http://127.0.0.1:9012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /relay-health {
        default_type application/json;
        return 200 '{"role":"rk3576-relay","lan":"192.168.100.2","car":"192.168.100.87","ws":"\/rosbridge","foxglove":"\/foxglove"}';
    }

    # 车端校时：返回本板 unix 时间（秒.毫秒）。
    # 车端无外网、无可用 NTP 客户端，只能从这条中继链路取时间。
    location = /time {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "$msec";
    }
}
