# =============================================================================
# 插入到 /www/server/panel/vhost/nginx/<SERVER_DOMAIN>.conf 的 server { } 内，
# 位置放在文件末尾（aaPanel 的“配置文件”里直接粘贴）即可。
#
# 关键点：
#   * ^~ 必须加：站点里有 location ~ \.(jpg|png...)$ 的正则，
#     否则 /api/shot/xxx.jpg 会被当成静态文件（404）。
#   * access_log off：心跳 5s 一条，别写访问日志（省磁盘、省 IO）。
#   * proxy_buffering off：指令长轮询要即时返回。
#   * client_max_body_size 2m：报警图只有 25~40KB，2m 是兜底。
# =============================================================================
location ^~ /api/ {
    access_log off;
    proxy_pass http://127.0.0.1:9080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_buffering off;
    client_max_body_size 2m;
}
