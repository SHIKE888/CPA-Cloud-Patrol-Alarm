[Unit]
# 10 秒 clip 的环形缓存写在 /mnt/sd/csi_ring (SD 卡), clip 合成写在
# /mnt/sd/csi_clips。开机时 SD 卡的挂载可能晚于 cloud-agent 启动,
# 那样 ClipRing.__init__ 里 os.makedirs 会失败, 代码只打一行
# "clip: 建目录失败（视频功能关闭）" 然后**不重试** —— 整段录像功能
# 就一直关着, 直到人工重启 cloud-agent。
#
# 实测 (2026-10-21): 10月20 22:34 开机后 /mnt/sd/csi_ring 根本不存在,
#       1.5 小时里一帧都没缓存; 手动 systemctl restart 后立刻恢复,
#       8fps × 13.5s = 108 帧, 5 秒正好 +40 帧。
#
# RequiresMountsFor 会让 systemd 等 /mnt/sd 挂好再起本服务, 并且
# 挂载消失时连带停掉服务(避免往未挂载的目录里写, 落到 eMMC 根分区)。
RequiresMountsFor=/mnt/sd
